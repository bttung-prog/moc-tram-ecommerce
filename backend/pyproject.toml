[project]
name = "backend"
version = "0.1.0"
description = "Backend API for Moc Tram Ecommerce"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.143.0",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
# Line length and target Python version
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
# Commonly used and effective linter rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (unused imports, undefined variables, etc.)
    "I",      # isort (automatically group and sort imports)
    "B",      # flake8-bugbear (common bugs and design issues)
    "C4",     # flake8-comprehensions (better list/set/dict comprehensions)
    "UP",     # pyupgrade (modernize Python syntax for Python 3.13)
]
ignore = [
    "E501",   # Ignore line-length violations (delegated to ruff format)
]

[tool.ruff.lint.flake8-bugbear]
# Allow FastAPI Dependency Injection in default function arguments without triggering B008
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "fastapi.Path",
    "fastapi.params.Path",
    "fastapi.Body",
    "fastapi.params.Body",
    "fastapi.Header",
    "fastapi.params.Header",
    "fastapi.Security",
    "fastapi.params.Security",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

